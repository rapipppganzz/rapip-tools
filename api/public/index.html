<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rapipp Tools | Auto Trace Engine</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Real Vectorization Engine -->
    <script src="https://cdn.jsdelivr.net/npm/imagetracerjs@1.2.6/imagetracer_v1.2.6.js"></script>

    <style>
        :root {
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-highlight: rgba(255, 255, 255, 0.12);
            --accent-primary: #4cc9f0;
            --accent-secondary: #7b2cbf;
            --text-main: #f8f9fa;
            --text-muted: #adb5bd;
            --bg-base: #07070a;
            --panel-bg: rgba(15, 15, 20, 0.6);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }

        body {
            background-color: var(--bg-base);
            background-image: 
                radial-gradient(circle at 10% 10%, rgba(123, 44, 191, 0.1), transparent 30%),
                radial-gradient(circle at 90% 90%, rgba(76, 201, 240, 0.1), transparent 30%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* Glass Utilities */
        .glass {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.2);
        }

        header {
            padding: 20px 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--glass-border);
            background: rgba(7, 7, 10, 0.8);
            backdrop-filter: blur(20px);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 1.4rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .workspace {
            display: flex;
            flex: 1;
            padding: 24px;
            gap: 24px;
            max-width: 1600px;
            margin: 0 auto;
            width: 100%;
        }

        /* Sidebar Controls */
        .controls-sidebar {
            width: 320px;
            flex-shrink: 0;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            height: fit-content;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .control-header {
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-muted);
        }

        input[type="range"] {
            width: 100%;
            -webkit-appearance: none;
            background: rgba(255,255,255,0.1);
            height: 6px;
            border-radius: 3px;
            outline: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: var(--accent-primary);
            cursor: pointer;
            box-shadow: 0 0 10px rgba(76, 201, 240, 0.5);
        }

        .toggle-group {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(0,0,0,0.2);
            padding: 12px 16px;
            border-radius: 12px;
            border: 1px solid var(--glass-border);
            cursor: pointer;
            user-select: none;
        }

        .toggle-group:hover { background: rgba(255,255,255,0.05); }

        .toggle-switch {
            width: 40px;
            height: 22px;
            background: rgba(255,255,255,0.1);
            border-radius: 11px;
            position: relative;
            transition: 0.3s;
        }

        .toggle-switch::after {
            content: '';
            position: absolute;
            top: 2px; left: 2px;
            width: 18px; height: 18px;
            background: white;
            border-radius: 50%;
            transition: 0.3s;
        }

        input[type="checkbox"] { display: none; }
        input[type="checkbox"]:checked + .toggle-switch { background: var(--accent-primary); }
        input[type="checkbox"]:checked + .toggle-switch::after { transform: translateX(18px); }

        select {
            width: 100%;
            padding: 10px;
            background: rgba(0,0,0,0.3);
            border: 1px solid var(--glass-border);
            color: white;
            border-radius: 8px;
            outline: none;
        }

        /* Main Preview Area */
        .preview-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .tabs {
            display: flex;
            gap: 10px;
            background: var(--panel-bg);
            padding: 8px;
            border-radius: 12px;
            border: 1px solid var(--glass-border);
            width: fit-content;
        }

        .tab {
            padding: 8px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--text-muted);
            transition: 0.3s;
        }

        .tab.active {
            background: rgba(255,255,255,0.1);
            color: white;
        }

        .canvas-container {
            flex: 1;
            min-height: 400px;
            background: repeating-conic-gradient(#111116 0% 25%, #181820 0% 50%) 50% / 24px 24px;
            border-radius: 16px;
            border: 1px solid var(--glass-border);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            padding: 20px;
        }

        .viewer {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .viewer img, .viewer svg, .viewer canvas {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            position: absolute;
            transition: opacity 0.3s;
        }

        /* Side-by-side mode */
        .viewer.sbs { position: relative; display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .viewer.sbs > div { position: relative; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
        .viewer.sbs img, .viewer.sbs svg { position: relative; }

        /* Actions Box */
        .export-panel {
            display: flex;
            gap: 16px;
            background: var(--panel-bg);
            padding: 20px;
            border-radius: 16px;
            border: 1px solid var(--glass-border);
            align-items: center;
            justify-content: space-between;
        }

        .btn {
            padding: 12px 24px;
            border-radius: 10px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: 0.2s;
            color: white;
            font-size: 0.95rem;
        }

        .btn-primary { background: linear-gradient(135deg, var(--accent-secondary), var(--accent-primary)); box-shadow: 0 4px 15px rgba(123,44,191,0.3); }
        .btn-primary:hover { filter: brightness(1.1); transform: translateY(-2px); }
        .btn-secondary { background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border); }
        .btn-secondary:hover { background: rgba(255,255,255,0.1); }

        /* Upload Screen overlay */
        #upload-overlay {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(7,7,10,0.9);
            z-index: 50;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            border-radius: 16px; border: 2px dashed var(--accent-primary);
            cursor: pointer;
        }

        .status-pill {
            padding: 8px 16px;
            border-radius: 20px;
            background: rgba(255,255,255,0.1);
            font-size: 0.85rem;
            display: flex; align-items: center; gap: 8px;
        }

        .dot { width: 8px; height: 8px; border-radius: 50%; background: #4cc9f0; }
        .processing .dot { animation: pulse 1s infinite; background: #ffaa00; }

        @keyframes pulse { 0% {transform:scale(1);opacity:1;} 50% {transform:scale(1.5);opacity:0.5;} 100% {transform:scale(1);opacity:1;} }
        
        @media (max-width: 900px) {
            .workspace { flex-direction: column; }
            .controls-sidebar { width: 100%; }
            .viewer.sbs { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo"><i class="fa-solid fa-wand-magic-sparkles"></i> Rapipp Tools</div>
        <div class="status-pill" id="status-pill"><div class="dot"></div><span id="status-text">Awaiting Image</span></div>
    </header>

    <div class="workspace">
        
        <!-- Auto Trace Engine Controls -->
        <aside class="controls-sidebar glass">
            <h3 style="margin-bottom: 5px; font-size: 1.1rem;">Auto Trace Engine</h3>
            <p style="color: var(--text-muted); font-size: 0.8rem; margin-bottom: 10px;">Adjust parameters to isolate the subject.</p>

            <div class="control-group">
                <div class="control-header"><span>Threshold</span> <span id="val-thresh">128</span></div>
                <input type="range" id="ctrl-thresh" min="0" max="255" value="128">
            </div>

            <div class="control-group">
                <div class="control-header"><span>Detail Level</span></div>
                <select id="ctrl-detail">
                    <option value="low">Low (Fewer Points)</option>
                    <option value="medium" selected>Medium (Balanced)</option>
                    <option value="high">High (Strict Boundary)</option>
                </select>
            </div>

            <div class="control-group">
                <div class="control-header"><span>Smoothness</span> <span id="val-smooth">50</span></div>
                <input type="range" id="ctrl-smooth" min="0" max="100" value="50">
            </div>

            <div class="control-group">
                <div class="control-header"><span>Simplification</span> <span id="val-simp">50</span></div>
                <input type="range" id="ctrl-simp" min="0" max="100" value="50">
            </div>

            <label class="toggle-group">
                <span>Invert Mask</span>
                <div><input type="checkbox" id="ctrl-invert"><div class="toggle-switch"></div></div>
            </label>

            <label class="toggle-group">
                <span>Remove Small Objects</span>
                <div><input type="checkbox" id="ctrl-rmsmall" checked><div class="toggle-switch"></div></div>
            </label>

            <label class="toggle-group">
                <span>Preserve Holes</span>
                <div><input type="checkbox" id="ctrl-holes" checked><div class="toggle-switch"></div></div>
            </label>

            <button class="btn btn-secondary" style="justify-content: center; margin-top: 10px;" onclick="document.getElementById('file-upload').click()">
                <i class="fa-solid fa-image"></i> Change Image
            </button>
            <input type="file" id="file-upload" accept="image/*" style="display:none;">
        </aside>

        <!-- Preview & Output -->
        <main class="preview-area">
            <div class="tabs">
                <div class="tab active" data-mode="sbs">Side-by-Side</div>
                <div class="tab" data-mode="overlay">Overlay</div>
                <div class="tab" data-mode="mask">Binary Mask</div>
            </div>

            <div class="canvas-container glass" id="drop-zone">
                <div id="upload-overlay">
                    <i class="fa-solid fa-cloud-arrow-up" style="font-size: 3rem; color: var(--accent-primary); margin-bottom: 15px;"></i>
                    <h2>Drop Image to Trace</h2>
                    <p style="color: var(--text-muted); margin-top: 5px;">PNG, JPG, WebP</p>
                </div>
                
                <div class="viewer sbs" id="viewer">
                    <div id="view-orig"><img id="img-original" src="" style="display:none;"></div>
                    <div id="view-result">
                        <!-- Canvas for Binary Mask preview -->
                        <canvas id="canvas-mask" style="display:none;"></canvas>
                        <!-- SVG Output container -->
                        <div id="svg-container" style="width:100%; height:100%; display:flex; justify-content:center; align-items:center;"></div>
                    </div>
                </div>
            </div>

            <div class="export-panel glass">
                <div>
                    <h3 style="margin-bottom: 5px;">Alight Motion Ready</h3>
                    <p style="font-size: 0.85rem; color: var(--text-muted);">Real geometric paths. No fake base64 data.</p>
                </div>
                <div style="display: flex; gap: 12px;">
                    <button class="btn btn-secondary" onclick="downloadSVG()"><i class="fa-solid fa-vector-square"></i> SVG</button>
                    <button class="btn btn-primary" onclick="downloadXML()"><i class="fa-solid fa-code"></i> AM XML</button>
                </div>
            </div>
        </main>
    </div>

    <script>
        // DOM Elements
        const DOM = {
            thresh: document.getElementById('ctrl-thresh'), valThresh: document.getElementById('val-thresh'),
            detail: document.getElementById('ctrl-detail'),
            smooth: document.getElementById('ctrl-smooth'), valSmooth: document.getElementById('val-smooth'),
            simp: document.getElementById('ctrl-simp'), valSimp: document.getElementById('val-simp'),
            invert: document.getElementById('ctrl-invert'),
            rmsmall: document.getElementById('ctrl-rmsmall'),
            holes: document.getElementById('ctrl-holes'),
            upload: document.getElementById('file-upload'),
            dropZone: document.getElementById('drop-zone'),
            overlay: document.getElementById('upload-overlay'),
            imgOrig: document.getElementById('img-original'),
            canvasMask: document.getElementById('canvas-mask'),
            svgCont: document.getElementById('svg-container'),
            viewer: document.getElementById('viewer'),
            tabs: document.querySelectorAll('.tab'),
            statusPill: document.getElementById('status-pill'),
            statusText: document.getElementById('status-text')
        };

        // State
        let sourceImage = null;
        let generatedSVGPath = "";
        let finalXMLData = "";
        let finalSVGData = "";
        let originalWidth = 0;
        let originalHeight = 0;
        let viewMode = 'sbs';
        let processTimeout = null;

        // UI Event Listeners
        DOM.upload.addEventListener('change', (e) => handleFile(e.target.files[0]));
        DOM.dropZone.addEventListener('dragover', e => { e.preventDefault(); DOM.overlay.style.borderColor = "#7b2cbf"; });
        DOM.dropZone.addEventListener('dragleave', e => { DOM.overlay.style.borderColor = "var(--accent-primary)"; });
        DOM.dropZone.addEventListener('drop', e => { e.preventDefault(); handleFile(e.dataTransfer.files[0]); });
        DOM.overlay.addEventListener('click', () => DOM.upload.click());

        // Range Value Updates & Debounced Processing
        ['thresh', 'smooth', 'simp'].forEach(id => {
            DOM[id].addEventListener('input', (e) => {
                DOM['val' + id.charAt(0).toUpperCase() + id.slice(1)].innerText = e.target.value;
            });
            DOM[id].addEventListener('change', triggerProcess);
        });
        
        ['detail', 'invert', 'rmsmall', 'holes'].forEach(id => {
            DOM[id].addEventListener('change', triggerProcess);
        });

        // Tabs
        DOM.tabs.forEach(tab => {
            tab.addEventListener('click', () => {
                DOM.tabs.forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                viewMode = tab.dataset.mode;
                updateViewerLayout();
            });
        });

        function setStatus(text, processing = false) {
            DOM.statusText.innerText = text;
            if(processing) DOM.statusPill.classList.add('processing');
            else DOM.statusPill.classList.remove('processing');
        }

        function handleFile(file) {
            if(!file || !file.type.match('image.*')) return;
            const reader = new FileReader();
            reader.onload = e => {
                const img = new Image();
                img.onload = () => {
                    sourceImage = img;
                    originalWidth = img.width;
                    originalHeight = img.height;
                    DOM.imgOrig.src = e.target.result;
                    DOM.imgOrig.style.display = "block";
                    DOM.overlay.style.display = "none";
                    
                    DOM.canvasMask.width = originalWidth;
                    DOM.canvasMask.height = originalHeight;
                    
                    triggerProcess();
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function triggerProcess() {
            if(!sourceImage) return;
            setStatus('Tracing Paths...', true);
            
            // Debounce logic to prevent UI freeze during slider drag
            clearTimeout(processTimeout);
            processTimeout = setTimeout(() => {
                executeAutoTraceEngine();
            }, 100);
        }

        function executeAutoTraceEngine() {
            // 1. Prepare controls
            const threshold = parseInt(DOM.thresh.value);
            const invert = DOM.invert.checked;
            const detail = DOM.detail.value;
            const smoothness = parseInt(DOM.smooth.value); // 0-100
            const simp = parseInt(DOM.simp.value); // 0-100
            const rmSmall = DOM.rmsmall.checked;
            const preserveHoles = DOM.holes.checked;

            // 2. Build Binary Mask on Canvas (Client-side Foreground separation)
            const ctx = DOM.canvasMask.getContext('2d');
            ctx.drawImage(sourceImage, 0, 0);
            const imgData = ctx.getImageData(0, 0, originalWidth, originalHeight);
            const data = imgData.data;

            const fgColor = {r: 255, g: 255, b: 255, a: 255}; // White is subject
            const bgColor = {r: 0, g: 0, b: 0, a: 255};       // Black is background

            for (let i = 0; i < data.length; i += 4) {
                // Calculate luminance
                const luma = (data[i]*0.299 + data[i+1]*0.587 + data[i+2]*0.114);
                let isFg = luma >= threshold;
                if(data[i+3] < 128) isFg = false; // Alpha transparency check
                if(invert) isFg = !isFg;

                if (isFg) {
                    data[i]=fgColor.r; data[i+1]=fgColor.g; data[i+2]=fgColor.b; data[i+3]=255;
                } else {
                    data[i]=bgColor.r; data[i+1]=bgColor.g; data[i+2]=bgColor.b; data[i+3]=255;
                }
            }
            ctx.putImageData(imgData, 0, 0);

            // 3. Map Settings to ImageTracer
            // Map Smoothness (0-100) -> blurradius (0 to 2) and curve tolerance (ltres/qtres)
            const blurRad = (smoothness > 75) ? 2 : (smoothness > 40 ? 1 : 0);
            
            // Detail Mapping
            let ltres = 1, qtres = 1;
            if(detail === 'low') { ltres = 2.0; qtres = 2.0; }
            else if(detail === 'high') { ltres = 0.1; qtres = 0.1; }
            
            // Map Simplification -> pathomit (drops paths with small area) and straight-line tolerance
            let pathOmit = rmSmall ? (simp / 100 * 30 + 4) : 0; // Drop 4 to 34 pixel areas if rmSmall is on
            
            const options = {
                ltres: ltres,
                qtres: qtres,
                pathomit: pathOmit,
                colorsampling: 0,
                numberofcolors: 2,
                mincolorratio: 0,
                colorquantcycles: 1,
                blurradius: blurRad,
                blurdelta: 20,
                stroke: 0,
                pal: [{r:0,g:0,b:0,a:255}, {r:255,g:255,b:255,a:255}], // Lock palette to pure B&W
                layering: 0 // Sequential layering
            };

            // 4. Execute Real Trace
            const svgString = ImageTracer.imagedataToSVG(imgData, options);
            
            // 5. Parse Geometry and Build Final Compound Path
            extractGeometricPaths(svgString, preserveHoles);
            
            updateViewerLayout();
            setStatus('Engine Ready', false);
        }

        function extractGeometricPaths(rawSVG, preserveHoles) {
            const parser = new DOMParser();
            const svgDoc = parser.parseFromString(rawSVG, "image/svg+xml");
            const paths = svgDoc.getElementsByTagName('path');
            
            let fgPaths = [];
            let bgPaths = [];

            // Sort paths by color
            for(let p of paths) {
                const fill = p.getAttribute('fill');
                const d = p.getAttribute('d');
                if(!d) continue;
                
                // Estimate area strictly by bounding box size of the path string 
                // (ImageTracer puts largest backgrounds first natively in layering:0, but we can double check)
                if(fill === 'rgb(255,255,255)') {
                    fgPaths.push(d);
                } else if(fill === 'rgb(0,0,0)') {
                    bgPaths.push(d);
                }
            }

            let compoundD = "";
            
            // Combine all foreground blobs
            if(fgPaths.length > 0) {
                compoundD += fgPaths.join(" ") + " ";
            }

            // To preserve holes correctly, we inject the background paths (excluding the main outer background).
            // ImageTracer generates the main background as the very first path, so we skip index 0.
            if(preserveHoles && bgPaths.length > 1) {
                // Drop the main background (index 0) and append the rest as internal hole cutouts
                bgPaths.shift(); 
                compoundD += bgPaths.join(" ");
            }

            // Cleanup string
            generatedSVGPath = compoundD.trim();

            if(!generatedSVGPath) {
                generatedSVGPath = "M 0 0"; // Fallback to prevent crash
            }

            // 6. Generate Outputs
            // For proper hole rendering, SVG requires fill-rule="evenodd" when combining positive and negative paths in one string.
            
            finalSVGData = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${originalWidth} ${originalHeight}" width="100%" height="100%">
    <path d="${generatedSVGPath}" fill="var(--accent-primary)" fill-rule="evenodd" />
</svg>`;

            // Pure Output SVG for Download
            const downloadSVGStr = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${originalWidth} ${originalHeight}" width="100%" height="100%">
    <path d="${generatedSVGPath}" fill="#ffffff" fill-rule="evenodd" stroke="none" />
</svg>`;
            
            // Generate Alight Motion XML
            // AM natively understands standard SVG path data format
            finalXMLData = `<?xml version="1.0" encoding="UTF-8"?>
<alightmotion>
    <scene id="rapipp_auto_trace">
        <element type="shape" name="Traced_Vector_Mask">
            <transform scale="1.0" rotation="0.0" />
            <shape>
                <path d="${generatedSVGPath}" fill="#ffffff" stroke="none" fill-rule="evenodd" />
            </shape>
        </element>
    </scene>
</alightmotion>`;

            // Inject to DOM
            DOM.svgCont.innerHTML = finalSVGData;
            
            // Store raw for downloader
            DOM.svgCont.dataset.raw = downloadSVGStr;
        }

        function updateViewerLayout() {
            if(!sourceImage) return;
            
            const origContainer = document.getElementById('view-orig');
            const resContainer = document.getElementById('view-result');
            const svgEl = DOM.svgCont.querySelector('svg');
            
            // Reset styles
            DOM.viewer.className = "viewer";
            DOM.canvasMask.style.display = 'none';
            DOM.svgCont.style.display = 'none';
            origContainer.style.display = 'none';
            resContainer.style.display = 'none';
            if(svgEl) {
                svgEl.style.fill = 'var(--accent-primary)';
                svgEl.style.opacity = '1';
                svgEl.querySelector('path').setAttribute('fill', 'var(--accent-primary)');
            }

            if(viewMode === 'sbs') {
                DOM.viewer.classList.add('sbs');
                origContainer.style.display = 'flex';
                resContainer.style.display = 'flex';
                DOM.svgCont.style.display = 'flex';
            } 
            else if(viewMode === 'overlay') {
                origContainer.style.display = 'flex';
                resContainer.style.display = 'flex';
                resContainer.style.position = 'absolute';
                resContainer.style.top = '0'; resContainer.style.left = '0';
                resContainer.style.width = '100%'; resContainer.style.height = '100%';
                
                DOM.svgCont.style.display = 'flex';
                // Style for overlay (Stroke only, transparent fill)
                if(svgEl) {
                    svgEl.querySelector('path').setAttribute('fill', 'rgba(76, 201, 240, 0.4)');
                    svgEl.querySelector('path').setAttribute('stroke', '#4cc9f0');
                    svgEl.querySelector('path').setAttribute('stroke-width', '2');
                }
            }
            else if (viewMode === 'mask') {
                resContainer.style.display = 'flex';
                DOM.canvasMask.style.display = 'block';
                DOM.canvasMask.style.width = '100%';
                DOM.canvasMask.style.height = '100%';
                DOM.canvasMask.style.objectFit = 'contain';
            }
        }

        // Export Functions
        function downloadSVG() {
            if(!finalSVGData) return alert("Upload and trace an image first.");
            const blob = new Blob([DOM.svgCont.dataset.raw], { type: 'image/svg+xml' });
            triggerDownload(blob, 'Rapipp_Trace.svg');
        }

        function downloadXML() {
            if(!finalXMLData) return alert("Upload and trace an image first.");
            const blob = new Blob([finalXMLData], { type: 'text/xml' });
            triggerDownload(blob, 'Rapipp_Mask_AM.xml');
        }

        function triggerDownload(blob, filename) {
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            a.click();
            URL.revokeObjectURL(url);
        }
    </script>
</body>
</html>
